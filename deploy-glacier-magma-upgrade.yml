name: Deploy Glacier & Magma Upgrade (add-only)
on:
  push:
    branches: [main]
    paths:
      - "Glacier-Magma-Upgrade/**"
      - ".github/workflows/deploy-glacier-magma-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Glacier-Magma-Upgrade/package-lock.json
      - name: Install dependencies
        working-directory: Glacier-Magma-Upgrade
        run: npm ci
      - name: Build upgraded game
        working-directory: Glacier-Magma-Upgrade
        run: npm run build -w client -- --base=./
        env:
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Glacier-Magma-Upgrade/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish upgraded game
        id: deployment
        uses: actions/deploy-pages@v4
