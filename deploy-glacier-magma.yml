name: Deploy Glacier and Magma to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-glacier-magma.yml"
      - "client/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the browser game
        run: npm run build -w client -- --base=./
        env:
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL }}

      - name: Upload website build
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
