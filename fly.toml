app = "glacier-magma"          # change to a globally unique name
primary_region = "sin"         # pick the region closest to most players: fly platform regions

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # rooms live in memory - never stop the machine
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "gm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
