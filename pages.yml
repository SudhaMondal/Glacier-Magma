# OPTIONAL: publish ONLY the website (client) on GitHub Pages. GitHub Pages cannot run the game server,
# so set the repo variable GAME_SERVER_URL (Settings -> Secrets and variables -> Actions -> Variables)
# to your deployed server, e.g. https://glacier-magma.onrender.com, and set CLIENT_ORIGIN on that server
# to https://<you>.github.io
name: Deploy client to GitHub Pages
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Require the game server URL
        run: |
          if [ -z "${{ vars.GAME_SERVER_URL }}" ]; then echo "::error::Set the repository variable GAME_SERVER_URL first (Settings > Secrets and variables > Actions > Variables). GitHub Pages cannot run the game server."; exit 1; fi
      - run: npm ci
      - run: npm run build -w client -- --base=./
        env: { VITE_SERVER_URL: "${{ vars.GAME_SERVER_URL }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: client/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
